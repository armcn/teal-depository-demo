name: Promote or roll back
run-name: Select production ${{ inputs.snapshot }}
on:
  workflow_dispatch:
    inputs:
      snapshot:
        description: 'Previously verified snapshot ID (an older one performs a rollback)'
        type: string
        required: true
      expected_current:
        description: 'Current production snapshot ID, or none for the first release'
        type: string
        required: true
        default: none
permissions:
  contents: read
concurrency:
  group: depository-writer
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    env:
      SNAPSHOT: ${{ inputs.snapshot }}
      RENV_PATHS_ROOT: /tmp/teal-renv-state
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: published
          path: storage
          persist-credentials: false
      - name: Require release source to be merged into main
        id: source
        run: python3 tools/assert-main.py "$SNAPSHOT"
      - name: Validate package inventory and checksums
        run: python3 tools/depository.py validate "storage/site/snapshots/$SNAPSHOT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: armcn/teal-architecture-demo
          ref: ${{ steps.source.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: renv
          working-directory: source
          use-public-rspm: false
      - name: Confirm retained snapshot still restores over HTTPS
        run: |
          python3 tools/verify-http.py "storage/site/snapshots/$SNAPSHOT"
          python3 source/scripts/release.py verify "storage/site/snapshots/$SNAPSHOT" --online
  promote:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: write
    env:
      SNAPSHOT: ${{ inputs.snapshot }}
      EXPECTED_CURRENT: ${{ inputs.expected_current }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: published
          path: storage
      - name: Require matching staging evidence and update production selection
        run: python3 tools/depository.py promote storage/site "$SNAPSHOT" --expected-current "$EXPECTED_CURRENT" --workflow-url "$RUN_URL"
      - run: bash tools/commit-site.sh "Select production snapshot $SNAPSHOT"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: storage/site
      - run: |
          printf '## Production selection\n\nSnapshot: `%s`\n\nPrevious: `%s`\n\nNo package archives were rebuilt or changed.\n' "$SNAPSHOT" "$EXPECTED_CURRENT" >> "$GITHUB_STEP_SUMMARY"
  pages:
    needs: promote
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
